<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Artemis Quest</title>
    <!-- App instalável (docs/pwa.md): o manifesto e o registerSW.js são injetados pelo vite-plugin-pwa no build. -->
    <meta name="theme-color" content="#473c3a" />
    <link rel="icon" type="image/png" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #473c3a; --sky: #e8b98c; --accent: #e8792b; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); }
      /* Celular: a página nunca rola nem "estica" (iOS e Android), nem dá zoom com toque duplo. Só painéis com
         conteúdo longo rolam por dentro (src/ui/style.css), sem arrastar a página junto. */
      html, body { position: fixed; inset: 0; width: 100%; overscroll-behavior: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
      canvas { touch-action: none; }
      canvas { display: block; }


      /* Tela de carregamento: HTML/CSS puro para aparecer antes de qualquer JS. Ver src/ui/LoadingScreen.ts */
      #loading {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        background: var(--sky); color: var(--ink);
        font: 600 18px/1.4 'Fredoka', ui-rounded, system-ui, sans-serif;
        transition: opacity 0.4s ease;
      }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #loading h1 { margin: 0; font-size: 48px; letter-spacing: 2px; text-shadow: 3px 3px 0 #fff; }
      /* Logotipo do jogo (Artemis Quest), no lugar do título em texto. */
      #loading .logo { display: block; width: min(520px, 86vw); height: auto; filter: drop-shadow(0 6px 0 rgba(71, 60, 58, 0.35)); }
      #loading .bar {
        position: relative; overflow: hidden;
        width: min(320px, 80vw); height: 22px;
        background: #fff; border: 4px solid var(--ink); border-radius: 999px;
      }
      #loading .bar::after {
        content: ''; position: absolute; top: 0; bottom: 0; left: -40%; width: 40%;
        background: var(--accent); border-radius: 999px;
        animation: slide 1.1s ease-in-out infinite;
      }
      #loading.error .bar::after { animation: none; left: 0; width: 100%; background: #ef476f; }
      #loading-status { min-height: 1.4em; text-align: center; padding: 0 16px; }
      #loading button {
        display: none; font: inherit; color: var(--ink); cursor: pointer;
        background: #ffd166; border: 4px solid var(--ink); border-radius: 12px; padding: 6px 18px;
      }
      #loading.error button { display: block; }
      @keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        #loading .bar::after { animation: none; left: 0; width: 100%; opacity: 0.6; }
      }
    </style>
  </head>
  <body class="loading">
    <div id="loading" role="status" aria-live="polite">
      <h1><img class="logo" src="./assets/ui/artemis-quest-logo.png" alt="Artemis Quest" width="720" height="367" /></h1>
      <div class="bar" aria-hidden="true"></div>
      <div id="loading-status">Loading…</div>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
