name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Regras da simulação (src/sim): testes de unidade, sem navegador.
      - run: npm test
      - run: npm run build
      # O servidor coop roda src/sim empacotado (ADR 0006). O npm run build regera o pacote.
      - name: Pacote das regras (sim.js) atualizado
        run: |
          git diff --exit-code server/internal/sim/simjs/sim.js || {
            echo "::error::src/sim mudou e o server/internal/sim/simjs/sim.js não. Rode 'npm run build' e commite o sim.js."
            exit 1
          }

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::rode gofmt -w ."; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # -race só no coop (salas e WebSocket): na ponte JS ele é lento e não acha nada novo.
      - run: go test -race ./internal/coop/
      - name: Imagem Docker monta
        working-directory: .
        run: docker build -f server/Dockerfile -t jezero-coop:ci .
